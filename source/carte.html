<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Total Studios Montréal | Carte</title>
<meta name="description" content="TOTAL STUDIOS, Montréal.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/favicon-blanc.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/cascadia-mono-light.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Archivo";font-weight:100 900;font-stretch:62% 125%;font-display:swap;src:url(/fonts/archivo.woff2) format("woff2")}
@font-face{font-family:"Cascadia Mono";font-weight:300;font-display:swap;src:url(/fonts/cascadia-mono-light.woff2) format("woff2")}
:root{--k:#000;--w:#fff;--g:#8f8f8f;--l:#2a2a2a;--y:#ccff00;--f:"Archivo",Helvetica,Arial,sans-serif;--mo:"Cascadia Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--k)}
body{min-height:100svh;background:var(--k);color:var(--w);font:300 14px/1.5 var(--mo);padding:calc(24px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
main{width:100%;max-width:560px;margin:0 auto;min-height:calc(100svh - 52px - env(safe-area-inset-top) - env(safe-area-inset-bottom));display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:block;width:clamp(120px,34vw,160px);height:auto;fill:var(--w)}
.lang{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--g)}
.lang button{all:unset;cursor:pointer;padding:6px 2px;color:var(--g);border-bottom:1px solid transparent}.lang button[aria-pressed=true]{color:var(--w);border-bottom-color:var(--w)}
.ls{display:flex;flex-direction:column;gap:4px;margin-top:clamp(56px,14svh,120px)}
.ls a{width:max-content;max-width:100%;padding:6px 0;color:var(--w);text-decoration:none;font:900 clamp(22px,6.6vw,40px)/1.1 var(--f);font-stretch:125%;text-transform:uppercase;letter-spacing:-.045em;transition:color .16s}
.ls a:active{color:var(--y)}
.so{display:flex;gap:28px;margin-top:clamp(28px,6svh,48px)}
.so a{display:flex;align-items:center;gap:12px;min-height:48px;color:var(--w);text-decoration:none;font:300 13px var(--mo);letter-spacing:.08em;text-transform:uppercase;transition:color .16s}
.so svg{width:32px;height:32px;display:block}
.sv{display:block;width:max-content;margin-top:20px;color:var(--g);font-size:12px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid #333;padding-bottom:2px;transition:color .16s,border-color .16s}
footer{margin-top:auto;padding-top:48px;color:#555;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
@media(hover:hover){.ls a:hover,.so a:hover{color:var(--y)}.sv:hover{color:var(--y);border-color:var(--y)}}
a:focus-visible,button:focus-visible{outline:2px solid var(--y);outline-offset:3px}
@media(prefers-reduced-motion:no-preference){main>*{animation:u .5s cubic-bezier(.2,.7,.2,1) both}main>*:nth-child(2){animation-delay:.05s}main>*:nth-child(3){animation-delay:.1s}main>*:nth-child(4){animation-delay:.15s}main>*:nth-child(5){animation-delay:.2s}@keyframes u{from{opacity:0;transform:translateY(10px)}}}
</style>
</head>
<body>
{{DEFS}}
<main>
<div class="top"><svg class="logo" viewBox="135.3 448.8 918.8 291.6" role="img" aria-label="TOTAL STUDIOS"><use href="#lgp"/></svg><div class="lang" role="group" aria-label="Langue"><button type="button" data-l="fr" aria-pressed="true">FR</button> / <button type="button" data-l="en" aria-pressed="false">EN</button></div></div>
<nav class="ls" aria-label="Liens">
<a href="/reserver/" data-i="res">Réserver</a>
<a href="/galerie/" data-i="gal">Notre travail</a>
<a href="/" data-i="site">Site web</a>
<a href="mailto:info@totalstudios.ca?subject=Demande%20d%E2%80%99information" id="ml" data-i="mail">Nous écrire</a>
</nav>
<div class="so">
<a href="#" aria-label="Instagram" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r=".6" fill="currentColor"/></svg><span>Instagram</span></a>
<a href="#" aria-label="Facebook" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-7.6h2.6l.4-3h-3V8.5c0-.9.3-1.5 1.5-1.5h1.6V4.3c-.3 0-1.2-.1-2.3-.1-2.3 0-3.8 1.4-3.8 3.9v2.3H8v3h2.5V21z"/></svg><span>Facebook</span></a>
</div>
<a class="sv" href="/total-studios.vcf" download data-i="vc">Enregistrer le contact</a>
<footer>Montréal</footer>
</main>
<script>
const D={fr:{res:'Réserver',gal:'Notre travail',site:'Site web',mail:'Nous écrire',vc:'Enregistrer le contact'},en:{res:'Book',gal:'Our work',site:'Website',mail:'Write to us',vc:'Save our contact'}};
function L(l){document.documentElement.lang=l=='en'?'en-CA':'fr-CA';document.querySelectorAll('[data-i]').forEach(e=>e.textContent=D[l][e.dataset.i]);document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l==l));try{localStorage.setItem('lg',l)}catch(_){}}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>L(b.dataset.l));
let l0='fr';try{l0=localStorage.getItem('lg')||((navigator.language||'').startsWith('en')?'en':'fr')}catch(_){}
if(l0=='en')L('en');
const ml=document.getElementById('ml');ml.addEventListener('click',()=>{let left=false;const f=()=>left=true;addEventListener('blur',f,{once:true});document.addEventListener('visibilitychange',f,{once:true});setTimeout(()=>{if(left)return;const m='info@totalstudios.ca';try{navigator.clipboard.writeText(m)}catch(_){}const t=ml.textContent;ml.textContent=(document.documentElement.lang=='en-CA'?'Copied: ':'Copié : ')+m;ml.style.fontSize='clamp(16px,4.6vw,24px)';setTimeout(()=>{ml.style.fontSize='';L(document.documentElement.lang=='en-CA'?'en':'fr')},3500)},900)});
</script>
</body>
</html>
