<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Total Studios Montréal | Carte</title>
<meta name="description" content="TOTAL STUDIOS : photographie sportive et contenu digital à Montréal.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/favicon-blanc.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/cascadia-mono-light.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Archivo";font-weight:100 900;font-stretch:62% 125%;font-display:swap;src:url(/fonts/archivo.woff2) format("woff2")}
@font-face{font-family:"Cascadia Mono";font-weight:300;font-display:swap;src:url(/fonts/cascadia-mono-light.woff2) format("woff2")}
:root{--k:#000;--w:#fff;--g:#8f8f8f;--l:#2a2a2a;--y:#ccff00;--f:"Archivo",Helvetica,Arial,sans-serif;--mo:"Cascadia Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--k)}
body{min-height:100svh;background:var(--k);color:var(--w);font:300 14px/1.5 var(--mo);display:flex;flex-direction:column;align-items:center;padding:max(28px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
main{width:100%;max-width:440px;display:flex;flex-direction:column;flex:1}
.lang{align-self:flex-end;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--g)}
.lang button{all:unset;cursor:pointer;padding:6px 4px;color:var(--g)}.lang button[aria-pressed=true]{color:var(--w)}
.logo{display:block;width:min(260px,70%);height:auto;fill:var(--w);margin:clamp(20px,5svh,56px) auto 0}
.tag{margin:22px auto 0;text-align:center;color:var(--g);font-size:12px;letter-spacing:.06em;text-transform:uppercase;text-wrap:balance}
.ls{display:grid;gap:12px;margin-top:clamp(24px,5svh,44px)}
.ls a{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:58px;padding:0 22px;border:1px solid var(--l);color:var(--w);text-decoration:none;font:900 14px/1 var(--f);font-stretch:125%;letter-spacing:-.03em;text-transform:uppercase;transition:border-color .16s,background .16s,color .16s}
.ls a span{font:300 12px var(--mo);letter-spacing:0;color:var(--g);transition:color .16s}
.ls a.pri{background:var(--w);color:var(--k);border-color:var(--w)}.ls a.pri span{color:var(--k)}
.ls a:active{border-color:var(--y)}
.so{display:flex;justify-content:center;gap:12px;margin-top:12px}
.so a{display:grid;place-items:center;width:58px;height:58px;border:1px solid var(--l);color:var(--w);transition:border-color .16s,color .16s}
.so svg{width:22px;height:22px}
.sv{display:block;width:max-content;margin:24px auto 0;color:var(--g);font-size:12px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid var(--l);padding-bottom:3px}
foot,footer{margin-top:auto;padding-top:40px;text-align:center;color:#555;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
@media(hover:hover){.ls a:hover{border-color:var(--y)}.ls a:hover span{color:var(--y)}.ls a.pri:hover{background:var(--y);border-color:var(--y)}.so a:hover{border-color:var(--y);color:var(--y)}.sv:hover{color:var(--y);border-color:var(--y)}}
a:focus-visible,button:focus-visible{outline:2px solid var(--y);outline-offset:3px}
@media(prefers-reduced-motion:no-preference){main>*{animation:u .5s cubic-bezier(.2,.7,.2,1) both}main>*:nth-child(2){animation-delay:.05s}main>*:nth-child(3){animation-delay:.1s}main>*:nth-child(4){animation-delay:.15s}main>*:nth-child(5){animation-delay:.2s}@keyframes u{from{opacity:0;transform:translateY(10px)}}}
</style>
</head>
<body>
{{DEFS}}
<main>
<div class="lang" role="group" aria-label="Langue"><button type="button" data-l="fr" aria-pressed="true">FR</button> / <button type="button" data-l="en" aria-pressed="false">EN</button></div>
<svg class="logo" viewBox="135.3 448.8 918.8 291.6" role="img" aria-label="TOTAL STUDIOS"><use href="#lgp"/></svg>
<p class="tag" data-i="tag">Photographie sportive et contenu digital</p>
<nav class="ls" aria-label="Liens">
<a class="pri" href="/reserver/" data-t="reserver"><b data-i="res">Réserver une session</b><span>→</span></a>
<a href="/galerie/" data-t="galerie"><b data-i="gal">Notre travail</b><span>→</span></a>
<a href="/" data-t="accueil"><b data-i="site">Notre site</b><span>→</span></a>
<a href="mailto:info@totalstudios.ca" data-t="courriel"><b data-i="mail">Nous écrire</b><span>→</span></a>
</nav>
<div class="so">
<a href="#" data-t="instagram" aria-label="Instagram" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r=".6" fill="currentColor"/></svg></a>
<a href="#" data-t="facebook" aria-label="Facebook" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-7.6h2.6l.4-3h-3V8.5c0-.9.3-1.5 1.5-1.5h1.6V4.3c-.3 0-1.2-.1-2.3-.1-2.3 0-3.8 1.4-3.8 3.9v2.3H8v3h2.5V21z"/></svg></a>
</div>
<a class="sv" href="/total-studios.vcf" data-t="contact" download data-i="vc">Enregistrer le contact</a>
<footer>Montréal</footer>
</main>
<script>
const D={fr:{tag:'Photographie sportive et contenu digital',res:'Réserver une session',gal:'Notre travail',site:'Notre site',mail:'Nous écrire',vc:'Enregistrer le contact'},en:{tag:'Sports photography and digital content',res:'Book a session',gal:'Our work',site:'Our website',mail:'Write to us',vc:'Save our contact'}};
function L(l){document.documentElement.lang=l=='en'?'en-CA':'fr-CA';document.querySelectorAll('[data-i]').forEach(e=>e.textContent=D[l][e.dataset.i]);document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l==l));try{localStorage.setItem('lg',l)}catch(_){}}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>L(b.dataset.l));
let l0='fr';try{l0=localStorage.getItem('lg')||((navigator.language||'').startsWith('en')?'en':'fr')}catch(_){}
if(l0=='en')L('en');
document.querySelectorAll('a[data-t]').forEach(a=>a.addEventListener('click',()=>{try{navigator.sendBeacon('/qr?t='+a.dataset.t)}catch(_){}}));
</script>
</body>
</html>
